<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santap Online – Pesan Makanan Favorit</title>
<meta name="description" content="Aplikasi web pemesanan makanan online yang responsif, dibuat untuk tugas HCI/UX dan Desain App Multi-platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F8F4;--surface:#fff;--ink:#16231F;--muted:#55625D;--brand:#0E6B55;--brand-ink:#fff;--accent:#F2A900;--line:#D8E0DB;--danger:#B3261E;--r:14px;
--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--bg:#0F1613;--surface:#18221E;--ink:#EAF1EE;--muted:#A3B2AC;--brand:#4FC3A1;--brand-ink:#08241C;--line:#2A3832;--danger:#FF8A80}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1613;--surface:#18221E;--ink:#EAF1EE;--muted:#A3B2AC;--brand:#4FC3A1;--brand-ink:#08241C;--line:#2A3832;--danger:#FF8A80}}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding-bottom:6rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:var(--brand-ink);padding:.6rem 1rem;z-index:99}
.skip:focus{left:0}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font:800 1.4rem var(--head);letter-spacing:-.02em;margin:0}
.logo span{color:var(--brand)}
.icon-btn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 .9rem}
main{max-width:1100px;margin:auto;padding:1.5rem 1rem}
h1{font:800 clamp(1.9rem,6vw,3.2rem)/1.05 var(--head);letter-spacing:-.03em;margin:.5rem 0 1rem;max-width:14ch}
.search{display:block;max-width:520px}
.search input{width:100%;min-height:52px;padding:0 1rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.search input:focus{border-color:var(--brand)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 1.25rem}
.chip{min-height:44px;padding:0 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.count{color:var(--muted);margin:0 0 .75rem}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.card{display:grid;grid-template-columns:76px 1fr auto;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem}
.pic{width:76px;height:76px;border-radius:10px;display:grid;place-items:center;font-size:2.4rem;background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.card h3{font:700 1.05rem/1.2 var(--head);margin:0 0 .15rem}
.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.35}
.price{font-weight:700;margin-top:.3rem!important;color:var(--ink)!important}
.add{min-height:44px;min-width:44px;padding:0 .9rem;border-radius:10px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700}
.add:active,.step button:active{transform:scale(.95)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));z-index:9;pointer-events:none}
.cartbar button{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:auto;min-height:56px;padding:0 1.2rem;border:0;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.cartbar[hidden]{display:none}
dialog{width:min(520px,100%);max-height:92vh;padding:0;border:0;border-radius:20px;background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media(max-width:600px){dialog{margin:auto 0 0;border-radius:20px 20px 0 0}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.sh h2{font:800 1.3rem var(--head);margin:0}
.sb{padding:1rem 1.25rem 1.5rem}
.row{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.row .pic{width:52px;height:52px;font-size:1.7rem}
.row .info{flex:1}
.row b{display:block}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.2rem}
.step output{min-width:1.5rem;text-align:center;font-weight:700}
.sum{margin:1rem 0}
.sum div{display:flex;justify-content:space-between;padding:.2rem 0}
.sum .tot{font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.6rem}
.hint{color:var(--muted);font-size:.9rem;margin:.25rem 0}
.btn{width:100%;min-height:52px;border-radius:var(--r);border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;margin-top:.5rem}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;width:auto}
.f{margin:0 0 1rem}
.f label,.f legend{display:block;font-weight:700;margin-bottom:.3rem;padding:0}
.f input[type=text],.f input[type=tel],.f textarea{width:100%;min-height:48px;padding:.65rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.f [aria-invalid=true]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.9rem;margin:.25rem 0 0}
fieldset{border:0;padding:0;margin:0 0 1rem}
.pay{display:flex;align-items:center;gap:.7rem;min-height:48px;padding:.4rem .8rem;border:2px solid var(--line);border-radius:10px;margin-bottom:.5rem}
.pay:has(input:checked){border-color:var(--brand)}
.pay input{width:20px;height:20px;accent-color:var(--brand)}
.track{list-style:none;padding:0;margin:1rem 0}
.track li{display:flex;gap:.7rem;align-items:center;padding:.55rem 0;color:var(--muted)}
.track li::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.track li.done{color:var(--ink)}
.track li.done::before{background:var(--brand);border-color:var(--brand)}
.track li.now{font-weight:700;color:var(--ink)}
.track li.now::before{background:var(--accent);border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;z-index:100;background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:12px;display:flex;gap:.8rem;align-items:center;max-width:calc(100% - 2rem)}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 .4rem}
footer{max-width:1100px;margin:auto;padding:1rem;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:no-preference){.add,.step button{transition:transform .1s}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#menu">Lewati ke daftar menu</a>
<header>
  <div class="bar">
    <p class="logo">Santap<span>Online</span></p>
    <button class="icon-btn" id="theme" type="button" aria-label="Ganti tema terang atau gelap">🌓 Tema</button>
  </div>
</header>

<main>
  <h1>Mau makan apa hari ini?</h1>
  <label class="search"><span class="hint">Cari nama menu</span>
    <input id="q" type="search" placeholder="Contoh: rawon, es teh" autocomplete="off">
  </label>
  <div class="chips" role="group" aria-label="Filter kategori" id="chips"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="grid" id="menu"></ul>
</main>

<footer>Proyek tugas Desain App Multi-platform &amp; HCI/UX. Data pesanan hanya simulasi dan disimpan di perangkat Anda.</footer>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" id="openCart"><span id="cbInfo"></span><span id="cbTotal"></span></button>
</div>

<dialog id="sheet" aria-labelledby="shTitle">
  <div class="sh"><h2 id="shTitle">Keranjang</h2><button class="icon-btn" type="button" id="closeSheet" aria-label="Tutup">✕</button></div>
  <div class="sb" id="sb"></div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden><span id="tmsg"></span><button type="button" id="tundo" hidden>Batalkan</button></div>

<script>
const MENU=[
{id:1,n:"Nasi Goreng Kampung",c:"Makanan",p:25000,e:"🍛",d:"Telur mata sapi, kerupuk, acar"},
{id:2,n:"Ayam Bakar Madu",c:"Makanan",p:32000,e:"🍗",d:"Nasi, lalapan, sambal terasi"},
{id:3,n:"Soto Ayam Lamongan",c:"Makanan",p:22000,e:"🍲",d:"Kuah kuning, koya, telur"},
{id:4,n:"Rawon Surabaya",c:"Makanan",p:30000,e:"🥘",d:"Kuah kluwek, daging empuk, tauge"},
{id:5,n:"Gado-gado",c:"Makanan",p:20000,e:"🥗",d:"Sayur rebus, lontong, bumbu kacang"},
{id:6,n:"Mie Ayam Bakso",c:"Makanan",p:24000,e:"🍜",d:"Mie kenyal, ayam kecap, 3 bakso"},
{id:7,n:"Tahu Crispy",c:"Camilan",p:12000,e:"🥟",d:"Renyah, bumbu cabai garam"},
{id:8,n:"Pisang Goreng Keju",c:"Camilan",p:15000,e:"🍌",d:"Pisang kepok, keju parut, susu"},
{id:9,n:"Lumpia Semarang",c:"Camilan",p:14000,e:"🌯",d:"Isi rebung dan ayam, 2 potong"},
{id:10,n:"Es Teh Manis",c:"Minuman",p:6000,e:"🧋",d:"Teh tubruk, es batu"},
{id:11,n:"Es Jeruk Peras",c:"Minuman",p:10000,e:"🍊",d:"Jeruk segar, tanpa pengawet"},
{id:12,n:"Kopi Susu Gula Aren",c:"Minuman",p:18000,e:"☕",d:"Espresso, susu, gula aren"}];
const CATS=["Semua","Makanan","Camilan","Minuman"];
const FEE=8000,FREE_AT=100000;
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+n.toLocaleString("id-ID");
let cart={},cat="Semua",view="cart",order=null,timer,tt,undoFn=null;
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const lines=()=>MENU.filter(m=>cart[m.id]).map(m=>({...m,q:cart[m.id]}));
const sub=()=>lines().reduce((s,l)=>s+l.p*l.q,0);
const fee=()=>sub()===0||sub()>=FREE_AT?0:FEE;
const qty=()=>lines().reduce((s,l)=>s+l.q,0);

function toast(msg,undo){
  $("#tmsg").textContent=msg;undoFn=undo||null;$("#tundo").hidden=!undo;$("#toast").hidden=false;
  clearTimeout(tt);tt=setTimeout(()=>$("#toast").hidden=true,5000);
}
$("#tundo").onclick=()=>{if(undoFn)undoFn();$("#toast").hidden=true};

function renderChips(){
  $("#chips").innerHTML=CATS.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
}
function renderMenu(){
  const q=$("#q").value.trim().toLowerCase();
  const list=MENU.filter(m=>(cat==="Semua"||m.c===cat)&&m.n.toLowerCase().includes(q));
  $("#count").textContent=list.length?`${list.length} menu tersedia`:"";
  $("#menu").innerHTML=list.length?list.map(m=>`<li class="card"><div class="pic" aria-hidden="true">${m.e}</div>
  <div><h3>${m.n}</h3><p>${m.d}</p><p class="price">${rp(m.p)}</p></div>
  <button class="add" type="button" data-add="${m.id}" aria-label="Tambah ${m.n} ke keranjang">+ Tambah</button></li>`).join("")
  :`<li class="empty">Menu “${q.replace(/[<>&]/g,"")}” tidak ditemukan. Coba kata lain atau pilih kategori Semua.</li>`;
}
function renderBar(){
  const n=qty();$("#cartbar").hidden=n===0;
  $("#cbInfo").textContent=`Lihat keranjang · ${n} item`;$("#cbTotal").textContent=rp(sub());
}
function change(id,d){
  const old=cart[id]||0,nw=Math.max(0,old+d);
  if(nw===0){delete cart[id];const m=MENU.find(x=>x.id===id);
    toast(`${m.n} dihapus dari keranjang`,()=>{cart[id]=old;save();refresh()})}
  else cart[id]=nw;
  save();refresh();
}
function refresh(){renderBar();if($("#sheet").open&&view==="cart")renderSheet()}

function summary(){
  const f=fee();
  return `<div class="sum"><div><span>Subtotal</span><span>${rp(sub())}</span></div>
  <div><span>Ongkos kirim</span><span>${f?rp(f):"Gratis"}</span></div>
  <div class="tot"><span>Total</span><span>${rp(sub()+f)}</span></div></div>`;
}
function renderSheet(){
  const sb=$("#sb"),t=$("#shTitle");
  if(view==="cart"){
    t.textContent="Keranjang";
    const L=lines();
    if(!L.length){sb.innerHTML=`<p class="empty">Keranjang masih kosong. Pilih menu favorit Anda dulu.</p><button class="btn" data-go="close">Lihat menu</button>`;return}
    const need=FREE_AT-sub();
    sb.innerHTML=L.map(l=>`<div class="row"><div class="pic" aria-hidden="true">${l.e}</div>
    <div class="info"><b>${l.n}</b><span class="hint">${rp(l.p)}</span></div>
    <div class="step"><button type="button" data-dec="${l.id}" aria-label="Kurangi ${l.n}">−</button><output aria-label="Jumlah ${l.n}">${l.q}</output><button type="button" data-inc="${l.id}" aria-label="Tambah ${l.n}">+</button></div></div>`).join("")
    +summary()+(need>0?`<p class="hint">Tambah ${rp(need)} lagi untuk gratis ongkir.</p>`:`<p class="hint">Selamat, ongkir Anda gratis.</p>`)
    +`<button class="btn" data-go="form">Lanjut ke pengiriman</button><button class="btn link" data-go="clear">Kosongkan keranjang</button>`;
  }else if(view==="form"){
    t.textContent="Data pengiriman";
    sb.innerHTML=`<form id="fm" novalidate>
    <div class="f"><label for="nm">Nama penerima</label><input id="nm" type="text" autocomplete="name" aria-describedby="e-nm"><p class="err" id="e-nm" hidden></p></div>
    <div class="f"><label for="hp">Nomor WhatsApp</label><input id="hp" type="tel" inputmode="tel" autocomplete="tel" placeholder="08123456789" aria-describedby="e-hp"><p class="err" id="e-hp" hidden></p></div>
    <div class="f"><label for="ad">Alamat lengkap</label><textarea id="ad" rows="3" autocomplete="street-address" placeholder="Jalan, nomor rumah, patokan" aria-describedby="e-ad"></textarea><p class="err" id="e-ad" hidden></p></div>
    <fieldset aria-describedby="e-py"><legend>Metode pembayaran</legend>
    ${["Bayar di tempat (COD)","QRIS","Transfer bank"].map((p,i)=>`<label class="pay"><input type="radio" name="py" value="${p}"${i===0?" checked":""}>${p}</label>`).join("")}
    <p class="err" id="e-py" hidden></p></fieldset>
    ${summary()}
    <button class="btn" type="submit">Pesan sekarang · ${rp(sub()+fee())}</button>
    <button class="btn alt" type="button" data-go="cart">Kembali ke keranjang</button></form>`;
  }else{
    t.textContent="Pesanan diterima";
    const S=["Pesanan diterima","Sedang dimasak","Dalam perjalanan","Sudah tiba"];
    sb.innerHTML=`<p><b>Nomor pesanan ${order.no}</b><br><span class="hint">Terima kasih, ${order.name}. Perkiraan tiba 25–35 menit (simulasi).</span></p>
    <ol class="track" aria-label="Status pesanan">${S.map((s,i)=>`<li class="${i<order.step?"done":i===order.step?"now":""}"${i===order.step?' aria-current="step"':""}>${s}</li>`).join("")}</ol>
    <div class="sum"><div class="tot"><span>Total ${order.pay}</span><span>${rp(order.total)}</span></div></div>
    <button class="btn" data-go="new">Pesan lagi</button>`;
  }
}
function openSheet(v){view=v;renderSheet();if(!$("#sheet").open)$("#sheet").showModal();$("#shTitle").focus?.()}
function validate(){
  const v=id=>$("#"+id).value.trim(),bad=[];
  const set=(id,msg)=>{const i=$("#"+id),e=$("#e-"+id);
    if(msg){e.textContent=msg;e.hidden=false;i.setAttribute("aria-invalid","true");bad.push(i)}
    else{e.hidden=true;i.removeAttribute("aria-invalid")}};
  set("nm",v("nm").length<3?"Isi nama minimal 3 huruf.":"");
  set("hp",/^(\+62|62|0)8\d{8,11}$/.test(v("hp").replace(/[\s-]/g,""))?"":"Nomor tidak valid. Contoh: 08123456789.");
  set("ad",v("ad").length<10?"Tulis alamat lebih lengkap, minimal 10 karakter.":"");
  return bad;
}
function advance(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!order||order.step>=3){clearInterval(timer);return}
    order.step++;if($("#sheet").open&&view==="done")renderSheet();
  },6000);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.cat){cat=d.cat;renderChips();renderMenu()}
  else if(d.add){change(+d.add,1);toast(`${MENU.find(m=>m.id==d.add).n} masuk keranjang`)}
  else if(d.inc)change(+d.inc,1);
  else if(d.dec)change(+d.dec,-1);
  else if(d.go==="form")openSheet("form");
  else if(d.go==="cart")openSheet("cart");
  else if(d.go==="close")$("#sheet").close();
  else if(d.go==="new"){$("#sheet").close()}
  else if(d.go==="clear"){const bk={...cart};cart={};save();refresh();toast("Keranjang dikosongkan",()=>{cart=bk;save();refresh()})}
});
$("#openCart").onclick=()=>openSheet("cart");
$("#closeSheet").onclick=()=>$("#sheet").close();
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.target.close()});
$("#q").addEventListener("input",renderMenu);
document.addEventListener("submit",e=>{
  e.preventDefault();
  const bad=validate();if(bad.length){bad[0].focus();return}
  order={no:"SO-"+Math.floor(1000+Math.random()*9000),name:$("#nm").value.trim(),pay:document.querySelector("[name=py]:checked").value,total:sub()+fee(),step:0};
  cart={};save();renderBar();view="done";renderSheet();advance();
  toast("Pesanan berhasil dikirim");
});
$("#theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}
};
try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
renderChips();renderMenu();renderBar();
</script>
</body>
</html>
